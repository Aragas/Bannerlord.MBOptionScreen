name: DocFX

on:
  push:
    branches:
      #- master
      # documentation will cover the dev branch for now.
      - dev
    paths:
      - '.github/workflows/docfx.yml'
      - 'src/MCM/**.cs'
      - 'docs/**'
  workflow_dispatch:

env:
  # Disable the .NET logo in the console output.
  DOTNET_NOLOGO: true
  # Disable the .NET first time experience to skip caching NuGet packages and speed up the build.
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # Disable sending .NET CLI telemetry to Microsoft.
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  docfx:
    name: DocFX Documentation
    runs-on: ubuntu-latest
    steps:
    - name: DocFX Setup
      uses: butr/actions-docfx-setup@v5
      with:
        github-token: ${{secrets.GITHUB_TOKEN}}

    - name: Build MCM
      run: dotnet build src/MCM/MCM.csproj;
      shell: pwsh

    - name: Fetch the game API xrefmap for the version we compile against
      # $(GameVersion) is the game API these docs describe, and it stays the only
      # place the version is written down. docfx.json names a fixed path, the
      # same way it already does for the generated Newtonsoft.Json map, and this
      # step puts the right version's map there.
      #
      # The game docs publish one tree per version under /v/<x.y.z>/, each map
      # carrying a baseUrl that pins it to that tree. Fetching the versioned map
      # rather than the site root is what keeps the links honest: the root
      # follows the current stable game, and would silently re-point every game
      # type in these docs at an API this build was never compiled against.
      run: |
        V=$(dotnet msbuild src/MCM/MCM.csproj -getProperty:GameVersion -nologo | tr -d '[:space:]')
        case "$V" in
          [0-9]*.[0-9]*.[0-9]*) ;;
          *) echo "::error::GameVersion resolved to '$V', which is not X.Y.Z"; exit 1 ;;
        esac

        # --compressed is required, not an optimisation: the host serves these
        # with gzip_static always, so without it curl writes compressed bytes
        # into a file docfx will try to parse as YAML.
        mkdir -p docs/xrefs
        curl -fsSL --compressed --max-time 300 "$SITE/v/$V/xrefmap.yml"              -o docs/xrefs/bannerlord-api-xrefmap.yml           || { echo "::error::no API docs published for game $V; see $SITE/versions.json"; exit 1; }

        head -1 docs/xrefs/bannerlord-api-xrefmap.yml | grep -q '^### YamlMime:XRefMap'           || { echo "::error::$SITE/v/$V/xrefmap.yml did not come back as an xrefmap"; exit 1; }

        echo "game $V, $(du -h docs/xrefs/bannerlord-api-xrefmap.yml | cut -f1)"
        grep -m1 '^baseUrl:' docs/xrefs/bannerlord-api-xrefmap.yml
      env:
        SITE: https://bannerlordapi.butr.link
      shell: bash

    - name: Run DocFX
      run: >-
        Copy-Item "README.md" -Destination "docs/index.md";
        docfx docs/docfx.json;
      shell: pwsh

    - name: Post-process xrefmap
      # Stamp baseUrl so consumers resolve to this site's own domain
      # rather than the github.io URL the map was fetched from, and drop
      # fields DocFX never looks up (it binary-searches on uid alone).
      run: >-
        sed -i -E
        -e '1a baseUrl: https://mcm.bannerlord.aragas.org/'
        -e '/^  (commentId|fullName|nameWithType): /d'
        docs/_site/xrefmap.yml
      shell: bash

    - name: Deploy DocFX
      uses: crazy-max/ghaction-github-pages@v5
      with:
        target_branch: gh-pages
        build_dir: docs/_site
      env:
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
